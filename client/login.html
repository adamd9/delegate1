<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In · Delegate</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #1b1d27;
      --surface: #22253a;
      --surface2: #2a2d42;
      --surface3: #181a26;
      --border: #2e3150;
      --border2: #383b5e;
      --accent: #818cf8;
      --red: #f87171;
      --text: #e2e4f0;
      --text-mid: #6b7194;
      --text-dim: #3d4268;
      --font: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      --font-ui: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(129,140,248,0.12), transparent 35%),
        var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }

    .auth-shell {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }

    .auth-header {
      padding: 28px 28px 18px;
      background: linear-gradient(180deg, rgba(129,140,248,0.1), rgba(129,140,248,0));
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-size: 12px;
      font-family: var(--font);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-mid);
      line-height: 1.5;
    }

    .auth-body {
      padding: 24px 28px 28px;
    }

    .field-label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-mid);
      font-size: 12px;
      font-weight: 600;
    }

    .field-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border2);
      background: var(--surface2);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .field-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.15);
    }

    .error-msg {
      display: none;
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(248, 113, 113, 0.3);
      background: rgba(248, 113, 113, 0.1);
      color: var(--red);
      font-size: 12px;
    }

    .actions {
      margin-top: 18px;
    }

    .btn-primary {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    .btn-primary:hover:not(:disabled) { background: #6d7cf4; }
    .btn-primary:disabled { opacity: 0.6; cursor: wait; }

    .helper {
      margin-top: 14px;
      font-size: 11px;
      color: var(--text-dim);
      font-family: var(--font);
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="auth-shell">
    <section class="auth-header">
      <div class="brand">Delegate</div>
      <h1>Sign in</h1>
      <p class="subtitle">Enter your admin password to continue.</p>
    </section>
    <section class="auth-body">
      <form id="login-form">
        <label class="field-label" for="password">Password</label>
        <input
          class="field-input"
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />
        <div class="error-msg" id="error-msg" role="alert" aria-live="polite"></div>
        <div class="actions">
          <button class="btn-primary" id="submit-btn" type="submit">Sign In</button>
        </div>
      </form>
      <div class="helper">delegate access control</div>
    </section>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submit-btn');
    const errorMsg = document.getElementById('error-msg');

    function showError(message) {
      errorMsg.textContent = message;
      errorMsg.style.display = 'block';
    }

    function clearError() {
      errorMsg.textContent = '';
      errorMsg.style.display = 'none';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearError();
      submitBtn.disabled = true;

      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: passwordInput.value })
        });

        if (response.ok) {
          window.location.href = '/';
          return;
        }

        if (response.status === 401) {
          showError('Invalid password');
        } else {
          showError('Unable to sign in. Please try again.');
        }
      } catch (error) {
        showError('Unable to sign in. Please try again.');
      } finally {
        submitBtn.disabled = false;
      }
    });

    passwordInput.addEventListener('input', clearError);
    passwordInput.focus();
  </script>
</body>
</html>
