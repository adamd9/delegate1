<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/vendor/theme-manager.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In · Delegate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Asap:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #eef2f5;
      --surface: #fbfdff;
      --surface2: #f4f8fc;
      --surface3: #edf3fa;
      --border: #d4dce7;
      --border2: #bcc9d8;
      --accent: #7a5630;
      --red: #bb4d4d;
      --text: #12161d;
      --text-mid: #596273;
      --text-dim: #8792a1;
      --font: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      --font-ui: 'Asap', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 0% 0%, #fbfdff 0%, rgba(251,253,255,0) 45%),
        linear-gradient(150deg, #f8fbff 0%, #f1f5fb 42%, #e9eef5 100%);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }

    .auth-shell {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 18px 40px rgba(44, 53, 68, 0.12);
      overflow: hidden;
    }

    .auth-header {
      padding: 28px 28px 18px;
      background: linear-gradient(180deg, rgba(122,86,48,0.08), rgba(122,86,48,0));
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-size: 12px;
      font-family: var(--font);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-mid);
      line-height: 1.5;
    }

    .auth-body {
      padding: 24px 28px 28px;
    }

    .field-label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-mid);
      font-size: 12px;
      font-weight: 600;
    }

    .field-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border2);
      background: var(--surface2);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .field-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(122, 86, 48, 0.14);
    }

    .error-msg {
      display: none;
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(248, 113, 113, 0.3);
      background: rgba(248, 113, 113, 0.1);
      color: var(--red);
      font-size: 12px;
    }

    .actions {
      margin-top: 18px;
    }

    .btn-primary {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fbfdff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    .btn-primary:hover:not(:disabled) { background: #654623; }
    .btn-primary:disabled { opacity: 0.6; cursor: wait; }

    .helper {
      margin-top: 14px;
      font-size: 11px;
      color: var(--text-dim);
      font-family: var(--font);
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="auth-shell">
    <section class="auth-header">
      <div class="brand">Delegate</div>
      <h1>Sign in</h1>
      <p class="subtitle">Enter your admin password to continue.</p>
    </section>
    <section class="auth-body">
      <form id="login-form">
        <label class="field-label" for="password">Password</label>
        <input
          class="field-input"
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />
        <div class="error-msg" id="error-msg" role="alert" aria-live="polite"></div>
        <div class="actions">
          <button class="btn-primary" id="submit-btn" type="submit">Sign In</button>
        </div>
      </form>
      <div class="helper">delegate access control</div>
    </section>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submit-btn');
    const errorMsg = document.getElementById('error-msg');

    function showError(message) {
      errorMsg.textContent = message;
      errorMsg.style.display = 'block';
    }

    function clearError() {
      errorMsg.textContent = '';
      errorMsg.style.display = 'none';
    }

    // Only allow same-origin relative paths (single leading slash). Rejects
    // protocol-relative (//host) and backslash tricks to prevent open redirects.
    function safeReturnTo() {
      try {
        const rt = new URLSearchParams(window.location.search).get('returnTo') || '';
        if (/^\/(?![\/\\])/.test(rt)) return rt;
      } catch (e) {}
      return '/';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearError();
      submitBtn.disabled = true;

      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: passwordInput.value })
        });

        if (response.ok) {
          window.location.href = safeReturnTo();
          return;
        }

        if (response.status === 401) {
          showError('Invalid password');
        } else {
          showError('Unable to sign in. Please try again.');
        }
      } catch (error) {
        showError('Unable to sign in. Please try again.');
      } finally {
        submitBtn.disabled = false;
      }
    });

    passwordInput.addEventListener('input', clearError);
    passwordInput.focus();
  </script>
</body>
</html>
