<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Settings · HK</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #1b1d27; --surface: #22253a; --surface2: #2a2d42; --surface3: #181a26;
      --border: #2e3150; --border2: #383b5e; --accent: #818cf8; --green: #34d399;
      --amber: #fbbf24; --red: #f87171; --blue: #60a5fa;
      --text: #e2e4f0; --text-mid: #6b7194; --text-dim: #3d4268;
      --font: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
      --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }
    html, body { min-height: 100%; }
    body {
      background: var(--bg); color: var(--text); font-family: var(--font-ui);
      display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
    }
    header {
      display: flex; align-items: center; gap: 12px; padding: 12px 20px;
      border-bottom: 1px solid var(--border); background: var(--surface3);
    }
    .back-btn {
      padding: 4px 10px; border-radius: 4px; border: 1px solid var(--border2);
      background: transparent; color: var(--text-mid); font-size: 11px; font-family: var(--font);
      cursor: pointer; text-decoration: none; display: inline-flex; align-items: center;
    }
    .back-btn:hover { color: var(--text); }
    h1 { font-size: 14px; font-weight: 600; color: var(--text); }
    .subtitle { color: var(--text-mid); font-size: 12px; }
    main {
      width: min(980px, calc(100% - 32px)); margin: 24px auto 40px;
      display: flex; flex-direction: column; gap: 18px;
    }
    .intro, .config-panel {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 18px;
    }
    .intro p { color: var(--text-mid); font-size: 13px; line-height: 1.6; }
    .panel-host { min-width: 0; }
    .config-panel + .config-panel { margin-top: 18px; }
    .config-field {
      display: flex; flex-direction: column; gap: 8px; padding: 14px;
      border-radius: 10px; border: 1px solid var(--border); background: var(--surface2);
    }
    .config-field-title { font-size: 13px; font-weight: 600; color: var(--text); }
    .config-help { font-size: 12px; color: var(--text-dim); line-height: 1.5; }
    .config-input, .config-select {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface3); color: var(--text); font-size: 13px; outline: none;
    }
    .config-input:focus, .config-select:focus {
      border-color: var(--accent); box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.12);
    }
    .btn {
      padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
      cursor: pointer; border: none; transition: background 0.15s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #6d7cf4; }
    .btn-primary:disabled { background: var(--surface2); color: var(--text-dim); cursor: not-allowed; }
    .btn-ghost { background: var(--surface2); color: var(--text-mid); }
    .btn-ghost:hover { background: var(--border); color: var(--text); }
    .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 6px; }
    @media (max-width: 640px) {
      main { width: min(100%, calc(100% - 24px)); margin-top: 16px; }
      header { padding: 12px 16px; }
      .intro, .config-panel { padding: 16px; }
    }
  </style>
  <script src="/auth-guard.js"></script>
</head>
<body>
  <header>
    <a class="back-btn" href="/">← back</a>
    <div>
      <h1>Email Settings</h1>
      <div class="subtitle">SMTP and IMAP configuration</div>
    </div>
  </header>

  <main>
    <section class="intro">
      <p>Configure outbound SMTP delivery and inbound IMAP polling for email workflows.</p>
    </section>

    <section id="smtp-panel" class="panel-host"></section>
    <section id="imap-panel" class="panel-host"></section>
  </main>

  <script src="/components/config-panel.js"></script>
  <script>
    ConfigPanel.render('#smtp-panel', {
      title: 'Email Sending (SMTP)',
      description: 'Outbound email configuration.',
      fields: [
        { key: 'EMAIL_SMTP_HOST', label: 'SMTP Host', type: 'text', help: 'SMTP server hostname.' },
        { key: 'EMAIL_SMTP_PORT', label: 'SMTP Port', type: 'number', default: '587', help: 'SMTP port (usually 587 for TLS).' },
        { key: 'EMAIL_SMTP_USER', label: 'SMTP Username', type: 'text' },
        { key: 'EMAIL_SMTP_PASS', label: 'SMTP Password', type: 'password', sensitive: true },
        { key: 'EMAIL_DEFAULT_FROM', label: 'Default From Address', type: 'text', help: 'Sender address for outbound emails.' },
        { key: 'EMAIL_SENDING_RESTRICTED', label: 'Restrict Outbound Sending', type: 'boolean', default: 'false', help: 'Limit who the system can send email to.' },
      ]
    });

    ConfigPanel.render('#imap-panel', {
      title: 'Email Receiving (IMAP)',
      description: 'Inbound email polling configuration.',
      fields: [
        { key: 'EMAIL_IMAP_HOST', label: 'IMAP Host', type: 'text', help: 'IMAP server hostname.' },
        { key: 'EMAIL_IMAP_PORT', label: 'IMAP Port', type: 'number', default: '993', help: 'IMAP port (usually 993 for TLS).' },
        { key: 'EMAIL_IMAP_USER', label: 'IMAP Username', type: 'text' },
        { key: 'EMAIL_IMAP_PASSWORD', label: 'IMAP Password', type: 'password', sensitive: true },
        { key: 'EMAIL_IMAP_TLS', label: 'Use TLS', type: 'boolean', default: 'true' },
        { key: 'EMAIL_RECEIVING_FILTER_ENABLED', label: 'Enable Receive Filter', type: 'boolean', default: 'false', help: 'Filter inbound mail before processing.' },
      ]
    });
  </script>
  <script src="/vendor/theme-manager.js"></script>
</body>
</html>
