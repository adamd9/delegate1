<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/vendor/theme-manager.js"></script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tasks · HK</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #1b1d27; --surface: #22253a; --surface2: #2a2d42; --surface3: #181a26;
      --border: #2e3150; --border2: #383b5e; --accent: #818cf8; --green: #34d399;
      --amber: #fbbf24; --red: #f87171; --blue: #60a5fa;
      --text: #e2e4f0; --text-mid: #6b7194; --text-dim: #3d4268;
      --font: 'SF Mono','Cascadia Code','Fira Code',monospace;
      --font-ui: 'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    }
    html, body { height: 100%; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-ui); font-size: 13px; display: flex; flex-direction: column; overflow: hidden; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; height: 48px; min-height: 48px;
      background: var(--surface3); border-bottom: 1px solid var(--border); gap: 12px;
    }
    .hdr-left { display: flex; align-items: center; gap: 12px; }
    .hdr-right { display: flex; align-items: center; gap: 8px; }
    h1 { font-size: 14px; font-weight: 600; }
    .back-btn, .hdr-btn, .primary-btn {
      padding: 4px 10px; border-radius: 4px; border: 1px solid var(--border2);
      background: transparent; color: var(--text-mid); font-size: 11px;
      font-family: var(--font); cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .back-btn:hover, .hdr-btn:hover { color: var(--text); }
    .primary-btn { background: var(--accent); color: #0b0d18; border-color: var(--accent); font-weight: 600; }
    .primary-btn:hover { filter: brightness(1.1); }
    .filter-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-mid); font-family: var(--font); }
    .filter-toggle input { accent-color: var(--accent); }
    .count-badge { font-size: 10px; color: var(--text-dim); font-family: var(--font); }

    .content { flex: 1; overflow-y: auto; padding: 16px 20px; }
    .content::-webkit-scrollbar { width: 4px; }
    .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .task-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 14px 16px; cursor: pointer; transition: border-color 0.15s, background 0.15s;
      display: flex; flex-direction: column; gap: 6px;
    }
    .task-card:hover { border-color: var(--accent); background: var(--surface2); }
    .task-card + .task-card { margin-top: 8px; }
    .task-card.archived { opacity: 0.55; }

    .row-top { display: flex; align-items: center; gap: 10px; }
    .pill {
      font-size: 10px; font-family: var(--font); padding: 2px 8px; border-radius: 999px;
      border: 1px solid; display: inline-flex; align-items: center; gap: 4px;
      white-space: nowrap;
    }
    .pill::before { content: '●'; }
    .pill.running         { color: var(--blue);  border-color: var(--blue); animation: pulse 1.4s ease-in-out infinite; }
    .pill.awaiting_user   { color: var(--amber); border-color: var(--amber); }
    .pill.completed       { color: var(--green); border-color: var(--green); }
    .pill.failed          { color: var(--red);   border-color: var(--red); }
    .pill.idle            { color: var(--text-mid); border-color: var(--border2); }
    .pill.archived        { color: var(--text-dim); border-color: var(--border2); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    .task-id { font-family: var(--font); font-size: 11px; color: var(--text-mid); }
    .task-time { margin-left: auto; font-size: 10px; color: var(--text-dim); font-family: var(--font); }
    .task-title { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.3; }
    .task-meta {
      font-size: 12px; color: var(--text-mid); line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; word-break: break-word;
    }
    .task-meta.needs-user { color: var(--amber); }

    .empty {
      display: flex; align-items: center; justify-content: center;
      height: 220px; color: var(--text-dim); font-size: 12px; font-family: var(--font);
      text-align: center; flex-direction: column; gap: 12px;
    }

    /* New task modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.6); align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-panel {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      width: 90vw; max-width: 560px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px;
    }
    .modal-panel h2 { font-size: 14px; font-weight: 600; }
    .modal-panel label { font-size: 11px; color: var(--text-mid); font-family: var(--font); display: block; margin-bottom: 4px; }
    .modal-panel input, .modal-panel textarea {
      width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border2);
      background: var(--surface2); color: var(--text); font-size: 12px; font-family: var(--font-ui);
      outline: none; resize: vertical;
    }
    .modal-panel input:focus, .modal-panel textarea:focus { border-color: var(--accent); }
    .modal-panel textarea { min-height: 120px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .modal-error { color: var(--red); font-size: 11px; font-family: var(--font); min-height: 14px; }
    .vnc-modal-panel { width: 90vw; max-width: 900px; max-height: 85vh; display: flex; flex-direction: column; }
    .vnc-modal-header { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .vnc-modal-header h2 { font-size: 14px; font-weight: 600; margin: 0; }
    .vnc-modal-close { background: transparent; border: none; color: var(--text-mid); font-size: 18px; cursor: pointer; }
    .vnc-modal-close:hover { color: var(--text); }
    .vnc-modal-body { flex: 1; min-height: 400px; display: flex; flex-direction: column; overflow: hidden; }
    .vnc-login-modal { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .vnc-login-modal input { padding: 6px 10px; border-radius: 4px; border: 1px solid var(--border2); background: var(--surface2); color: var(--text); font-size: 12px; outline: none; }
    .vnc-login-modal input:focus { border-color: var(--accent); }
    .vnc-login-modal button { padding: 8px 12px; border-radius: 4px; border: 1px solid var(--accent); background: var(--accent); color: #0b0d18; font-size: 12px; font-weight: 600; cursor: pointer; }
    .vnc-login-modal button:hover { filter: brightness(1.1); }
    .vnc-error-modal { color: var(--red); font-size: 11px; min-height: 14px; }
    .vnc-display-modal { flex: 1; background: #000; display: none; }
  </style>
  <script src="/auth-guard.js"></script>
</head>
<body>
  <header>
    <div class="hdr-left">
      <a class="back-btn" href="/">← back</a>
      <h1>🤖 Tasks</h1>
      <span class="count-badge" id="count-badge"></span>
    </div>
    <div class="hdr-right">
      <button class="hdr-btn" id="vnc-btn-header" title="Open VNC browser control">🖥 browser</button>
      <label class="filter-toggle"><input type="checkbox" id="show-archived"/> show archived</label>
      <button class="hdr-btn" id="refresh-btn">↺ refresh</button>
      <button class="primary-btn" id="new-task-btn">＋ new task</button>
    </div>
  </header>

  <div class="content" id="content">
    <div class="empty" id="empty-msg">Loading…</div>
  </div>

  <!-- New task modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-panel">
      <h2>New task</h2>
      <div>
        <label for="new-title">title (optional, auto-generated from prompt)</label>
        <input type="text" id="new-title" placeholder="e.g. coles shopping for next week"/>
      </div>
      <div>
        <label for="new-prompt">prompt</label>
        <textarea id="new-prompt" placeholder="What should the agent do?" autofocus></textarea>
      </div>
      <div class="modal-error" id="modal-error"></div>
      <div class="modal-actions">
        <button class="hdr-btn" id="modal-cancel">cancel</button>
        <button class="primary-btn" id="modal-create">create task</button>
      </div>
    </div>
  </div>

  <!-- VNC Modal -->
  <div class="modal-overlay" id="vnc-modal-overlay">
    <div class="vnc-modal-panel">
      <div class="vnc-modal-header">
        <h2>🖥 VNC Browser</h2>
        <button class="vnc-modal-close" id="vnc-modal-close">✕</button>
      </div>
      <div class="vnc-modal-body">
        <div class="vnc-login-modal" id="vnc-login-modal">
          <input type="password" id="vnc-password-modal" placeholder="VNC password"/>
          <button id="vnc-connect-btn-modal">connect</button>
          <div class="vnc-error-modal" id="vnc-error-modal"></div>
        </div>
        <div class="vnc-display-modal" id="vnc-display-modal"></div>
      </div>
    </div>
  </div>

<script>
const content = document.getElementById('content');
const emptyMsg = document.getElementById('empty-msg');
const countBadge = document.getElementById('count-badge');
const showArchived = document.getElementById('show-archived');

function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

function timeAgo(ts) {
  if (!ts) return '';
  const ms = typeof ts === 'number' ? ts : new Date(ts).getTime();
  if (!ms || isNaN(ms)) return '';
  const diff = Date.now() - ms;
  if (diff < 0) return 'just now';
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  const d = Math.floor(h / 24);
  if (d < 30) return d + 'd ago';
  return new Date(ms).toLocaleDateString();
}

function pillLabel(status) {
  switch (status) {
    case 'running': return 'running';
    case 'awaiting_user': return 'awaiting you';
    case 'completed': return 'done';
    case 'failed': return 'failed';
    case 'idle': return 'idle';
    case 'archived': return 'archived';
    default: return status || '';
  }
}

function sortTasks(tasks) {
  const ms = (t) => new Date(t.last_active_at || 0).getTime();
  const priority = (t) => {
    const recent = (Date.now() - ms(t)) < 86400000;
    if ((t.status === 'awaiting_user' || t.status === 'failed') && recent) return 0;
    if (t.status === 'running') return 1;
    return 2;
  };
  return [...tasks].sort((a, b) => {
    const pa = priority(a), pb = priority(b);
    if (pa !== pb) return pa - pb;
    return ms(b) - ms(a);
  });
}

async function loadTasks() {
  try {
    const params = new URLSearchParams();
    if (showArchived.checked) params.set('include_archived', 'true');
    const res = await fetch('/api/copilot/tasks?' + params.toString(), { credentials: 'include' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    renderTasks(data.tasks || []);
  } catch (err) {
    emptyMsg.textContent = 'Failed to load tasks: ' + (err.message || err);
    emptyMsg.style.display = '';
  }
}

function renderTasks(tasks) {
  content.querySelectorAll('.task-card').forEach(el => el.remove());
  countBadge.textContent = tasks.length ? '(' + tasks.length + ')' : '';

  if (tasks.length === 0) {
    emptyMsg.innerHTML = '<div>No tasks yet</div><button class="primary-btn" onclick="document.getElementById(\'new-task-btn\').click()">＋ create your first task</button>';
    emptyMsg.style.display = '';
    return;
  }
  emptyMsg.style.display = 'none';

  for (const t of sortTasks(tasks)) {
    const card = document.createElement('div');
    card.className = 'task-card' + (t.archived ? ' archived' : '');
    const meta = t.needs_user_reason
      ? '<div class="task-meta needs-user">⚠ needs you to: ' + esc(t.needs_user_reason) + '</div>'
      : (t.last_summary
          ? '<div class="task-meta">' + esc(t.last_summary) + '</div>'
          : (t.last_prompt ? '<div class="task-meta">' + esc(t.last_prompt) + '</div>' : ''));
    card.innerHTML =
      '<div class="row-top">' +
        '<span class="pill ' + esc(t.status) + '">' + esc(pillLabel(t.status)) + '</span>' +
        '<span class="task-id">#' + esc(t.id) + '</span>' +
        '<span class="task-time">' + esc(timeAgo(t.last_active_at)) + '</span>' +
      '</div>' +
      '<div class="task-title">' + esc(t.title || '(untitled)') + '</div>' +
      meta;
    card.addEventListener('click', () => { location.href = '/tasks/' + encodeURIComponent(t.id); });
    content.appendChild(card);
  }
}

// ── New task modal ──
const modal = document.getElementById('modal-overlay');
const modalTitle = document.getElementById('new-title');
const modalPrompt = document.getElementById('new-prompt');
const modalError = document.getElementById('modal-error');
const modalCreate = document.getElementById('modal-create');

function openModal() {
  modalTitle.value = '';
  modalPrompt.value = '';
  modalError.textContent = '';
  modal.classList.add('open');
  setTimeout(() => modalPrompt.focus(), 50);
}
function closeModal() { modal.classList.remove('open'); }

document.getElementById('new-task-btn').addEventListener('click', openModal);
document.getElementById('modal-cancel').addEventListener('click', closeModal);
modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

modalPrompt.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); modalCreate.click(); }
});

modalCreate.addEventListener('click', async () => {
  const prompt = modalPrompt.value.trim();
  if (!prompt) { modalError.textContent = 'prompt is required'; return; }
  modalCreate.disabled = true;
  modalError.textContent = '';
  try {
    const res = await fetch('/api/copilot/tasks', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ title: modalTitle.value.trim() || undefined, prompt, source: 'tasks-ui' }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
    closeModal();
    location.href = '/tasks/' + encodeURIComponent(data.task.id);
  } catch (err) {
    modalError.textContent = err.message || String(err);
  } finally {
    modalCreate.disabled = false;
  }
});

document.getElementById('refresh-btn').addEventListener('click', loadTasks);
showArchived.addEventListener('change', loadTasks);

// Periodic refresh so pills update without manual reload
setInterval(loadTasks, 5000);
loadTasks();
</script>
</body>
</html>
