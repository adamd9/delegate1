<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/vendor/theme-manager.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCP Servers · HK</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #1b1d27; --surface: #22253a; --surface2: #2a2d42; --surface3: #181a26;
      --border: #2e3150; --border2: #383b5e; --accent: #818cf8; --accent-dim: rgba(129,140,248,0.12);
      --green: #34d399; --green-dim: rgba(52,211,153,0.1);
      --red: #f87171; --red-dim: rgba(248,113,113,0.1);
      --amber: #fbbf24; --amber-dim: rgba(251,191,36,0.1);
      --text: #e2e4f0; --text-mid: #6b7194; --text-dim: #3d4268;
      --font: 'SF Mono','Fira Code','Consolas',monospace;
      --font-ui: -apple-system,BlinkMacSystemFont,'Inter',sans-serif;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--font-ui); min-height: 100vh; display: flex; flex-direction: column; font-size: 13px; -webkit-font-smoothing: antialiased; }
    header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--surface3); flex-shrink: 0; }
    .back-btn { padding: 4px 10px; border-radius: 4px; border: 1px solid var(--border2); background: transparent; color: var(--text-mid); font-size: 11px; font-family: var(--font); cursor: pointer; text-decoration: none; }
    .back-btn:hover { color: var(--text); }
    h1 { font-size: 14px; font-weight: 600; }
    .hdr-sub { font-size: 11px; color: var(--text-mid); max-width: 400px; margin-left: 4px; }
    .hdr-right { margin-left: auto; display: flex; gap: 8px; }
    .btn { padding: 6px 14px; border-radius: 5px; border: 1px solid var(--border2); background: transparent; color: var(--text-mid); font-size: 12px; font-family: var(--font-ui); cursor: pointer; }
    .btn:hover:not(:disabled) { color: var(--text); background: var(--surface2); }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn-primary { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }
    .btn-primary:hover:not(:disabled) { background: rgba(129,140,248,0.2); }
    .main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 0; overflow: hidden; }
    .panel { display: flex; flex-direction: column; overflow: hidden; padding: 20px; gap: 12px; }
    .panel + .panel { border-left: 1px solid var(--border); }
    .panel-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); font-family: var(--font); }
    input, select, textarea {
      width: 100%; background: var(--surface); border: 1px solid var(--border2);
      border-radius: 5px; padding: 8px 10px; font-family: var(--font); font-size: 12px;
      color: var(--text); outline: none; line-height: 1.4;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 80px; }
    .editor-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .editor-card { border: 1px solid var(--border2); border-radius: 8px; padding: 14px; background: var(--surface2); }
    .editor-card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .editor-card-title { font-family: var(--font); font-size: 11px; color: var(--text-mid); }
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .field { min-width: 0; }
    .field.full { grid-column: 1 / -1; }
    .field label { display: block; font-size: 10px; color: var(--text-mid); margin-bottom: 4px; }
    .field-help { color: var(--text-dim); font-size: 10px; line-height: 1.4; margin-top: 4px; }
    .auth-fields { display: contents; }
    .remove-btn { color: var(--red); border-color: rgba(248,113,113,0.35); padding: 4px 8px; }
    .empty-editor { color: var(--text-dim); font-size: 12px; padding: 24px 0; text-align: center; }
    .server-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .server-list::-webkit-scrollbar { width: 3px; }
    .server-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
    .server-card { border: 1px solid var(--border2); border-radius: 8px; padding: 12px; background: var(--surface2); }
    .sc-name { font-size: 12px; font-weight: 600; color: var(--text); font-family: var(--font); }
    .sc-url { font-size: 11px; color: var(--text-mid); font-family: var(--font); margin-top: 3px; word-break: break-all; }
    .sc-status { font-size: 10px; margin-top: 6px; display: flex; align-items: center; gap: 6px; }
    .sc-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .sc-dot.ok { background: var(--green); }
    .sc-dot.err { background: var(--red); }
    .sc-dot.pending { background: var(--text-dim); }
    .sc-tools { font-size: 10px; color: var(--text-dim); margin-top: 4px; font-family: var(--font); }
    .sc-tool-tag { display: inline-block; background: var(--surface); border: 1px solid var(--border); border-radius: 3px; padding: 1px 6px; margin: 2px; }
    .notice { padding: 8px 12px; border-radius: 5px; font-size: 12px; }
    .notice-ok { background: var(--green-dim); border: 1px solid rgba(52,211,153,0.25); color: var(--green); }
    .notice-err { background: var(--red-dim); border: 1px solid rgba(248,113,113,0.25); color: var(--red); }
    .dirty-indicator { font-size: 11px; color: var(--amber); font-family: var(--font); }
    @media (max-width: 700px) {
      .main { grid-template-columns: 1fr; overflow: visible; }
      .panel + .panel { border-left: none; border-top: 1px solid var(--border); }
      .field-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
    }
  </style>
<script src="/auth-guard.js"></script>
</head>
<body>
  <header>
    <a class="back-btn" href="/">← back</a>
    <h1>Remote MCP Servers</h1>
    <div class="hdr-right">
      <button class="btn" id="refresh-btn">refresh</button>
      <button class="btn btn-primary" id="save-btn" disabled>save</button>
      <span class="dirty-indicator" id="dirty-indicator" style="display:none;">unsaved changes</span>
    </div>
  </header>
  <div id="notice" style="display:none;margin:12px 20px;"></div>
  <div class="main">
    <div class="panel">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
        <div>
          <div class="panel-label">server configuration</div>
          <div style="font-size:11px;color:var(--text-dim);margin-top:5px;">Choose an authentication method. Delegate formats the HTTP header for you.</div>
        </div>
        <button class="btn" id="add-btn">add server</button>
      </div>
      <div class="editor-list" id="editor-list"></div>
    </div>
    <div class="panel">
      <div class="panel-label">configured servers</div>
      <div class="server-list" id="server-list"><div style="color:var(--text-dim);font-size:12px;">loading…</div></div>
    </div>
  </div>

<script>
  let editors = [];
  let originalSnapshot = '';
  let saving = false;

  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function setNotice(msg, type) {
    const el = document.getElementById('notice');
    if (!msg) { el.style.display = 'none'; return; }
    el.className = `notice notice-${type}`;
    el.textContent = msg;
    el.style.display = '';
  }

  function parseLegacyAuth(headers) {
    const cleanHeaders = { ...(headers || {}) };
    const authorizationKey = Object.keys(cleanHeaders).find(key => key.toLowerCase() === 'authorization');
    if (!authorizationKey) return { authMode: 'none', username: '', password: '', token: '', headers: cleanHeaders };

    const value = cleanHeaders[authorizationKey];
    if (typeof value === 'string' && value.startsWith('Bearer ')) {
      delete cleanHeaders[authorizationKey];
      return { authMode: 'bearer', username: '', password: '', token: value.slice(7), headers: cleanHeaders };
    }
    if (typeof value === 'string' && value.startsWith('Basic ')) {
      const encoded = value.slice(6).trim();
      let credentials = encoded;
      try {
        const decoded = atob(encoded);
        if (decoded.includes(':')) credentials = decoded;
      } catch {}
      const separator = credentials.indexOf(':');
      if (separator >= 0) {
        delete cleanHeaders[authorizationKey];
        return {
          authMode: 'basic',
          username: credentials.slice(0, separator),
          password: credentials.slice(separator + 1),
          token: '',
          headers: cleanHeaders,
        };
      }
    }
    return { authMode: 'none', username: '', password: '', token: '', headers: cleanHeaders };
  }

  function toEditor(server) {
    const customHeaders = { ...(server.headers || {}) };
    if (server.auth) {
      const authorizationKey = Object.keys(customHeaders).find(key => key.toLowerCase() === 'authorization');
      if (authorizationKey) delete customHeaders[authorizationKey];
    }
    let auth = {
      authMode: 'none',
      username: '',
      password: '',
      token: '',
      headers: customHeaders,
    };
    if (server.auth?.type === 'basic') {
      auth = { ...auth, authMode: 'basic', username: server.auth.username || '', password: server.auth.password || '' };
    } else if (server.auth?.type === 'bearer') {
      auth = { ...auth, authMode: 'bearer', token: server.auth.token || '' };
    } else {
      auth = parseLegacyAuth(server.headers);
    }
    return {
      name: server.name || '',
      url: server.url || '',
      ...auth,
      headersText: Object.keys(auth.headers).length ? JSON.stringify(auth.headers, null, 2) : '',
    };
  }

  function renderEditors() {
    const list = document.getElementById('editor-list');
    if (!editors.length) {
      list.innerHTML = '<div class="empty-editor">no servers configured</div>';
      return;
    }
    list.innerHTML = '';
    editors.forEach((server, index) => {
      const card = document.createElement('div');
      card.className = 'editor-card';
      card.dataset.index = index;
      card.innerHTML = `
        <div class="editor-card-head">
          <div class="editor-card-title">MCP server ${index + 1}</div>
          <button class="btn remove-btn" type="button" data-action="remove">remove</button>
        </div>
        <div class="field-grid">
          <div class="field"><label>Display name</label><input data-field="name" autocomplete="off"></div>
          <div class="field"><label>Server URL</label><input data-field="url" type="url" autocomplete="off" placeholder="https://example.com/mcp"></div>
          <div class="field full">
            <label>Authentication</label>
            <select data-field="authMode">
              <option value="none">None</option>
              <option value="basic">Basic authentication</option>
              <option value="bearer">Bearer token</option>
            </select>
            <div class="field-help" data-role="auth-help"></div>
          </div>
          <div class="auth-fields" data-role="auth-fields"></div>
          <div class="field full">
            <label>Additional custom headers (optional JSON object)</label>
            <textarea data-field="headersText" spellcheck="false" placeholder='{"X-Custom-Header": "value"}'></textarea>
            <div class="field-help">Use this only for headers other than Authorization; authentication is configured above.</div>
          </div>
        </div>`;
      card.querySelector('[data-field="name"]').value = server.name;
      card.querySelector('[data-field="url"]').value = server.url;
      card.querySelector('[data-field="authMode"]').value = server.authMode;
      card.querySelector('[data-field="headersText"]').value = server.headersText;
      list.appendChild(card);
      renderAuthFields(card, server);
    });
  }

  function renderAuthFields(card, server) {
    const fields = card.querySelector('[data-role="auth-fields"]');
    const help = card.querySelector('[data-role="auth-help"]');
    if (server.authMode === 'basic') {
      help.textContent = 'Delegate Base64-encodes username:password and sends the standard Authorization: Basic header.';
      fields.innerHTML = `
        <div class="field"><label>Username</label><input data-field="username" autocomplete="username"></div>
        <div class="field"><label>Password / API key</label><input data-field="password" type="password" autocomplete="new-password"></div>`;
      fields.querySelector('[data-field="username"]').value = server.username;
      fields.querySelector('[data-field="password"]').value = server.password;
    } else if (server.authMode === 'bearer') {
      help.textContent = 'Delegate prefixes the token with Bearer and sends it in the Authorization header.';
      fields.innerHTML = `
        <div class="field full"><label>Bearer token</label><input data-field="token" type="password" autocomplete="new-password"></div>`;
      fields.querySelector('[data-field="token"]').value = server.token;
    } else {
      help.textContent = 'No Authorization header will be sent.';
      fields.innerHTML = '';
    }
  }

  function snapshot() {
    return JSON.stringify(editors);
  }

  function buildConfig() {
    return editors.map((server, index) => {
      const name = server.name.trim();
      const url = server.url.trim();
      if (!name) throw new Error(`Server ${index + 1}: display name is required.`);
      if (!url) throw new Error(`Server ${index + 1}: URL is required.`);
      let parsedUrl;
      try { parsedUrl = new URL(url); } catch { throw new Error(`Server ${index + 1}: enter a valid URL.`); }
      if (!['http:', 'https:'].includes(parsedUrl.protocol)) {
        throw new Error(`Server ${index + 1}: URL must use http or https.`);
      }

      const config = { type: 'streamable-http', url, name };
      if (server.authMode === 'basic') {
        if (!server.password) throw new Error(`${name}: Basic auth password / API key is required.`);
        config.auth = { type: 'basic', username: server.username, password: server.password };
      } else if (server.authMode === 'bearer') {
        if (!server.token) throw new Error(`${name}: Bearer token is required.`);
        config.auth = { type: 'bearer', token: server.token };
      }

      if (server.headersText.trim()) {
        let headers;
        try { headers = JSON.parse(server.headersText); } catch (error) {
          throw new Error(`${name}: custom headers must be valid JSON (${error.message}).`);
        }
        if (!headers || Array.isArray(headers) || typeof headers !== 'object') {
          throw new Error(`${name}: custom headers must be a JSON object.`);
        }
        for (const [key, value] of Object.entries(headers)) {
          if (typeof value !== 'string') throw new Error(`${name}: custom header "${key}" must have a string value.`);
          if (key.toLowerCase() === 'authorization') {
            throw new Error(`${name}: configure Authorization using the Authentication field, not custom headers.`);
          }
        }
        if (Object.keys(headers).length) config.headers = headers;
      }
      return config;
    });
  }

  function renderServers(servers, discoveryStatus) {
    const list = document.getElementById('server-list');
    if (!servers || !servers.length) {
      list.innerHTML = '<div style="font-size:12px;color:var(--text-dim);">no servers configured</div>';
      return;
    }
    list.innerHTML = servers.map(srv => {
      const status = discoveryStatus?.[srv.name] || {};
      const dotClass = status.status === 'connected' ? 'ok' : status.status === 'error' ? 'err' : 'pending';
      const statusText = status.status || 'unknown';
      const tools = status.tools || [];
      return `<div class="server-card">
        <div class="sc-name">${esc(srv.name || '(unnamed)')}</div>
        <div class="sc-url">${esc(srv.url || srv.command || '')}</div>
        <div class="sc-status">
          <div class="sc-dot ${dotClass}"></div>
          <span style="color:var(--text-mid);font-size:10px;font-family:var(--font);">${esc(statusText)}</span>
          ${status.toolCount != null ? `<span style="color:var(--text-dim);font-size:10px;font-family:var(--font);">${status.toolCount} tools</span>` : ''}
        </div>
        ${tools.length ? `<div class="sc-tools">${tools.map(t => `<span class="sc-tool-tag">${esc(t)}</span>`).join('')}</div>` : ''}
        ${status.error ? `<div style="font-size:10px;color:var(--red);margin-top:4px;font-family:var(--font);">${esc(status.error)}</div>` : ''}
      </div>`;
    }).join('');
  }

  async function load() {
    setNotice(null);
    try {
      const res = await fetch('/api/mcp/config');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      editors = (data.servers || []).map(toEditor);
      renderEditors();
      originalSnapshot = snapshot();
      updateDirty();
      renderServers(data.servers, data.discoveryStatus);
    } catch (e) {
      setNotice(e.message, 'err');
    }
  }

  function updateDirty() {
    const dirty = snapshot() !== originalSnapshot;
    document.getElementById('save-btn').disabled = !dirty || saving;
    document.getElementById('dirty-indicator').style.display = dirty ? '' : 'none';
  }

  async function save() {
    if (saving) return;
    saving = true;
    const saveBtn = document.getElementById('save-btn');
    saveBtn.disabled = true;
    saveBtn.textContent = 'saving…';
    setNotice(null);
    try {
      const config = buildConfig();
      const text = JSON.stringify(config, null, 2);
      const res = await fetch('/api/mcp/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      if (!res.ok) {
        const error = await res.json().catch(() => null);
        throw new Error(error?.error || `HTTP ${res.status}`);
      }
      const result = await res.json();
      editors = result.servers.map(toEditor);
      renderEditors();
      originalSnapshot = snapshot();
      updateDirty();
      renderServers(result.servers, result.discoveryStatus);
      setNotice('Configuration saved and MCP discovery reloaded.', 'ok');
    } catch (e) {
      setNotice(e.message, 'err');
    } finally {
      saving = false;
      saveBtn.textContent = 'save';
      updateDirty();
    }
  }

  document.getElementById('editor-list').addEventListener('input', event => {
    const field = event.target.dataset.field;
    const card = event.target.closest('.editor-card');
    if (!field || !card) return;
    editors[Number(card.dataset.index)][field] = event.target.value;
    updateDirty();
  });
  document.getElementById('editor-list').addEventListener('change', event => {
    if (event.target.dataset.field !== 'authMode') return;
    const card = event.target.closest('.editor-card');
    const server = editors[Number(card.dataset.index)];
    server.authMode = event.target.value;
    renderAuthFields(card, server);
    updateDirty();
  });
  document.getElementById('editor-list').addEventListener('click', event => {
    const button = event.target.closest('[data-action="remove"]');
    if (!button) return;
    const card = button.closest('.editor-card');
    editors.splice(Number(card.dataset.index), 1);
    renderEditors();
    updateDirty();
  });
  document.getElementById('add-btn').addEventListener('click', () => {
    editors.push({ name: '', url: '', authMode: 'none', username: '', password: '', token: '', headersText: '' });
    renderEditors();
    updateDirty();
    document.getElementById('editor-list').lastElementChild?.scrollIntoView({ behavior: 'smooth' });
  });
  document.getElementById('refresh-btn').addEventListener('click', load);
  document.getElementById('save-btn').addEventListener('click', save);

  load();
</script>
</body>
</html>
