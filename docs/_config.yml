title: Delegate 1
description: Single-session, multi-channel AI assistant — text, voice, phone, SMS, email.
remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache

url: ""
baseurl: "/delegate1"

permalink: pretty

search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s\-/]+/
  rel_url: true
  button: false

heading_anchors: true

aux_links:
  "GitHub":
    - "https://github.com/adamd9/delegate1"

aux_links_new_tab: true

color_scheme: dark

nav_external_links:
  - title: Source on GitHub
    url: https://github.com/adamd9/delegate1
    hide_icon: false

footer_content: 'Delegate 1 docs &middot; <a href="https://github.com/adamd9/delegate1">GitHub</a>'

back_to_top: true
back_to_top_text: "Back to top"

# Just-the-Docs callouts
callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
  tip:
    title: Tip
    color: green

# Ignore project files when building site
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - _archive
