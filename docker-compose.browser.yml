services:
  delegate1-browser:
    build:
      context: .
      dockerfile: Dockerfile.browser
    ports:
      - "8081:8081"   # App (includes VNC web viewer)
    volumes:
      - delegate1-runtime-data:/app/runtime-data
      - delegate1-gh-copilot-data:/root/.local/share/gh
    env_file:
      - .env
    environment:
      - DOCKER=true
    restart: unless-stopped

volumes:
  delegate1-runtime-data:
  delegate1-gh-copilot-data:
